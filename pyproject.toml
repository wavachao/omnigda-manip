[project]
name = "omnigda-manip"
version = "0.1.0"
description = "Training-Free Multimodal 2D-3D Few-Shot Open-Vocabulary Robotic Perception and Grasping System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.9",
    "einops>=0.8",
    "tqdm>=4.66",
    "torch>=2.5,<2.7",
    "torchvision>=0.20,<0.22",
    "timm>=1.0",
    "open-clip-torch>=2.26",
    "open3d>=0.18",
    "mani-skill>=3.0.0b15",
    "mplib>=0.1.1",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime-gpu>=1.19",
    "tensorrt>=10.4,<10.10",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnigda"]

[tool.uv]
package = true
no-build-isolation-package = []

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint"
